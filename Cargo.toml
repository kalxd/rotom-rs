[package]
name = "rotom-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["drv"]

[dependencies]
ntex-multipart = "3.2.0"
ntex-files = "3.2.0"
sha2 = "0.10.9"
drv = { path = "./drv" }

[dependencies.uuid]
version = "1.24.0"
features = ["v4"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.config]
version = "0.15.25"
default-features = false
features = ["toml"]

[dependencies.futures]
version = "0.3.31"
default-features = false

[dependencies.ntex]
version = "3.12.3"
default-features = false
features = ["tokio", "compress"]

[dependencies.sqlx]
version = "0.9.0"
features = ["postgres", "runtime-tokio", "uuid"]

[dependencies.ralts]
git = "http://192.168.31.10:8086/XGLib/ralts.git"
tag = "v0.0.2"